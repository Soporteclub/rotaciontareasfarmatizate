version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmatizate-tareas
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  db-data:
    driver: local
