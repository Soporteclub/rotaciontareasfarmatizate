# CI — quality gates for every push and PR to main.
# FIX (PROC-01, CFG-05, FE-08): previously there was NO CI; every push went
# straight to production. TypeScript errors were hidden by
# `typescript.ignoreBuildErrors: true` and ESLint had all useful rules off.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          # Build doesn't need a real DB, but Prisma needs a URL to generate the client
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
          SKIP_PRISMA_DB_PUSH: "true"

  security-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # FIX (SEC-01): would have caught "farmatizate2025" hardcoded in source.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for scanning all commits

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
